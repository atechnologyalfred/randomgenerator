<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90vh;
        background-color: #000;
    }

    .container {
        width: 40rem;
        height: 70%;
        margin: 0 auto;
        background-color: #f4f5f8;
        border-radius: 2rem;
        box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    ul {
        overflow: auto;
        width: 89%;
        margin-bottom: 2rem;

    }

    h1 {
        text-transform: uppercase;
        font-family: monospace;
    }

    button {
        padding: 1rem 2rem;
        border-radius: 2rem;
        cursor: pointer;
        transition: all .3s ease-in-out;
        font-size: 1.4rem;
    }

    button:hover {
        background-color: #000;
        color: #fff;
    }

    p {
        font-weight: bold;
    }

    .name {
        color: red;
        text-transform: uppercase;
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
        cursor: pointer;
    }
    .name:hover {
        text-decoration: underline;
        text-decoration-color: green;
    }

        @media(max-width: 768px){
        .container {
        width: 98%;
        height: 98%;
         margin-top: 2.6rem;
        }
            ul {
        overflow: auto;
        width: 90%;     

    }
    }
</style>

<body>
    <div class="container">
        <h1>Ts academy cohort students</h1>
        <button>Show student</button>
        <ul class="display">

        </ul>

    </div>

</body>
<script>
    const show = document.querySelector('p');
    const btn = document.querySelector('button');
    const display = document.querySelector('.display');
    const names = ["Esther", "Alfred", "Emeka", "Jerry", "Yusuf", "Faith", "Grace", "Emmanuel",
        "Johnson", "Ganger", "Oghenekaro", "Peace", "Taiwo", "Paul", "Ijeh", "Daniel", "Benjamin", "Mike", "Ronaldo"
    ]
    btn.addEventListener("click", function () {

        console.log("welcome");
        const random = Math.floor(Math.random() * names.length);
        const list = document.createElement('li');
        const del = document.createElement('button');
        del.textContent = 'x';
        del.style.color = 'red';
        del.style.border = 'none';
        del.addEventListener('click', function(){
            list.remove()
        })
        list.innerHTML = `My name is <span class="name" onclick="showBox('${names[random]}')">${names[random]}</span>, I am in the phoenix cohort of Ts academy`
        list.appendChild(del);
        display.appendChild(list);


    })
    function showBox(value){
        alert(`Your name is ${value} `)
    }


</script>

</html>
